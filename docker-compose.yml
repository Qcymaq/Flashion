services:
  backend:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    restart: unless-stopped
    # Values are read from the .env file next to this compose file (see .env.example).
    environment:
      - ENV=${ENV:-production}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/uploads:/backend/app/uploads
      - ./backend/app/static:/backend/app/static
    healthcheck:
      # The python:3.11-slim image has no curl, so use Python's standard library.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=https://flashion.xyz/api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=https://flashion.xyz/api
    # No need to expose port 80 if using host Nginx